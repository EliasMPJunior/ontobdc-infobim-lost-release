<script id="ontobdc-surface-url-state">
(() => {
  const DEFAULTS = {"lang":"pt-BR","theme":"light"};
  const NAMES = Object.keys(DEFAULTS);

  const current = () => new URLSearchParams(location.search);

  // The address bar is the source of truth; DEFAULTS only answers for a
  // parameter the URL does not carry.
  const value = (name) => current().get(name) ?? DEFAULTS[name] ?? null;

  // Stamp every missing default into the address bar, so even the very first
  // open of a generated page is an explicit, shareable, reproducible URL
  // rather than one whose rendering depends on build-time knowledge.
  function ensureDefaults() {
    const url = new URL(location.href);
    let changed = false;
    for (const name of NAMES) {
      if (url.searchParams.has(name)) continue;
      url.searchParams.set(name, DEFAULTS[name]);
      changed = true;
    }
    if (!changed) return;
    try {
      // Same-document rewrite: no reload, no extra history entry.
      history.replaceState(history.state, "", url.href);
    } catch {
      // Some browsers refuse replaceState with a URL on an opaque-origin
      // (file://) document. A replacing navigation reaches the same
      // normalized URL; the parameters are present on that load, so the
      // branch cannot run twice and cannot loop.
      location.replace(url.href);
    }
  }

  // Carry the live presentation state onto an internal link rather than
  // letting each component re-derive it. A parameter the link already
  // declares wins: inheriting must never overwrite an explicit choice, and
  // must never stamp a build-time default over the user's selection.
  function decorate(href) {
    try {
      const target = new URL(href, location.href);
      const params = current();
      for (const name of NAMES) {
        const carried = params.get(name);
        if (carried !== null && !target.searchParams.has(name)) {
          target.searchParams.set(name, carried);
        }
      }
      return target.href;
    } catch {
      return href;
    }
  }

  // The one place a presentation parameter is *changed*. Writing it into the
  // URL and navigating means page initialization re-derives the whole
  // rendering from the address bar, so a reload, a bookmark and a shared
  // link all reproduce it — and no Tile has to know how that is done.
  function withParam(name, value) {
    const url = new URL(location.href);
    url.searchParams.set(name, value);
    return url.href;
  }

  function select(name, value) {
    if (value === null || value === undefined || value === "") return false;
    let target;
    try {
      target = withParam(name, value);
    } catch {
      return false;
    }
    // Already the active URL: navigating would only cost a reload.
    if (target === location.href) return false;
    try {
      // assign(), not replace(): the change stays undoable with Back.
      location.assign(target);
      return true;
    } catch {
      // Navigation refused (sandboxed frame, exotic scheme). The caller has
      // already applied the change in-document, so the control still works
      // for this session — it just will not survive the next reload.
      return false;
    }
  }

  // Runs before the deferred component modules upgrade any Tile, so the
  // document is already in the URL's language at first paint instead of
  // flashing the language it was generated in.
  function applyLanguage() {
    const language = value("lang");
    if (!language) return;
    document.documentElement.lang = language;
    document.documentElement.dataset.language = language;
  }

  ensureDefaults();
  applyLanguage();

  window.ontobdcUrlState = {
    defaults: { ...DEFAULTS },
    names: [...NAMES],
    current,
    value,
    withParam,
    select,
    decorate,
    applyLanguage,
  };
})();
</script>
<script>
  (() => {
    const themes = [{"name": "light", "label": "Light", "tokens": {"background": "#ffffff", "foreground": "#0f172a", "accent": "#0284c7", "borderColor": "rgba(2,132,199,.35)"}, "options": {"transparentBackground": false}}, {"name": "dark", "label": "Dark", "tokens": {"background": "#000000", "foreground": "#f8fafc", "accent": "#38bdf8", "borderColor": "rgba(56,189,248,.55)"}, "options": {"transparentBackground": false}}];
    const requested = window.ontobdcUrlState?.value("theme")
      ?? new URLSearchParams(location.search).get("theme");
    const theme = themes.find((candidate) => candidate.name === requested) ?? themes[0];
    if (!theme) return;
    document.documentElement.dataset.theme = theme.name;
    for (const [key, value] of Object.entries(theme.tokens ?? {})) {
      document.documentElement.style.setProperty(`--onto-theme-${key}`, value);
    }
    document.addEventListener("DOMContentLoaded", () => {
      const backLink = document.querySelector(".back-link");
      if (!backLink) return;
      const decorate = window.ontobdcUrlState?.decorate;
      if (decorate) backLink.href = decorate(backLink.getAttribute("href"));
    });
  })();
</script>

/* The overlay itself must stay click-through — it sits on top of
   .ontobdc-annotation-overlay (the existing-annotation markers) and,
   set to "auto" across its whole (usually empty/transparent) box, was
   swallowing every click meant for a marker underneath before it
   could ever reach one. Only the actual drawn point/box/handle
   shapes should be clickable. */
.ontobdc-annotation-geometry-overlay { pointer-events: none; }
.ontobdc-annotation-geometry-point,.ontobdc-annotation-geometry-box,.ontobdc-annotation-geometry-handle { pointer-events: auto; }
.ontobdc-annotation-geometry-point,.ontobdc-annotation-geometry-box { cursor: move; }
.ontobdc-annotation-geometry-handle { fill: #fff; stroke: var(--ontobdc-annotation-accent,#67e8f9); stroke-width: 3px; cursor: nwse-resize; }
/* A neutral, translucent handle overlaid on the annotation's own
   marker — not a second, competing colored shape (which is what a
   solid accent-colored fill here looked like: a distinct disc rather
   than "this marker is the one you're editing"). */
.ontobdc-annotation-geometry-point {
  fill: rgba(226, 232, 240, .28);
  stroke: rgba(226, 232, 240, .92);
  stroke-width: 2px;
}
.ontobdc-annotation-geometry-box {
  fill: rgba(103, 232, 249, .08);
  stroke: var(--ontobdc-annotation-accent, #67e8f9);
  stroke-width: 3px;
  stroke-dasharray: 10 7;
}

  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 20%, transparent);
  border-left-width: 4px;
  background: color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 4%, transparent);
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.ontobdc-subject-page-item:hover {
  background: color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 8%, transparent);
}
.ontobdc-subject-page-item[aria-current="true"] {
  border-color: var(--onto-theme-accent, #67e8f9);
  box-shadow: 0 0 0 1px var(--onto-theme-accent, #67e8f9);
}
.ontobdc-subject-page-item.ontobdc-subject-page-cat-border-note { border-left-color: var(--onto-theme-accent, #67e8f9); }
.ontobdc-subject-page-item.ontobdc-subject-page-cat-border-issue { border-left-color: #f87171; }
.ontobdc-subject-page-item.ontobdc-subject-page-cat-border-classification { border-left-color: #c084fc; }
.ontobdc-subject-page-item.ontobdc-subject-page-cat-border-location { border-left-color: #4ade80; }
.ontobdc-subject-page-item.ontobdc-subject-page-cat-border-record { border-left-color: #fbbf24; }
.ontobdc-subject-page-item-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ontobdc-subject-page-item-snippet {
  font-size: .8125rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ontobdc-subject-page-item-meta {
  font-size: .68rem;
  color: color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 48%, transparent);
}

/* ---------- timeline tab ---------- */
.ontobdc-subject-page-timeline { display: flex; flex-direction: column; }
.ontobdc-subject-page-timeline-row { display: grid; grid-template-columns: 74px 18px 1fr; gap: 0 10px; }
.ontobdc-subject-page-timeline-time {
  font-size: .68rem;
  color: color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 48%, transparent);
  padding-top: 10px;
  text-align: right;
}
.ontobdc-subject-page-timeline-rail { display: flex; flex-direction: column; align-items: center; }
.ontobdc-subject-page-timeline-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--onto-theme-accent, #67e8f9);
  margin-top: 12px;
  flex: none;
}
.ontobdc-subject-page-timeline-line {
  width: 1px;
  flex: 1;
  background: color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 20%, transparent);
}
.ontobdc-subject-page-timeline-row:last-child .ontobdc-subject-page-timeline-line { display: none; }
.ontobdc-subject-page-timeline-row .ontobdc-subject-page-item { margin: 3px 0 10px; }

/* ---------- people tab ---------- */
.ontobdc-subject-page-people-group { display: flex; flex-direction: column; gap: 8px; }
.ontobdc-subject-page-people-heading { display: flex; align-items: center; gap: 9px; }
.ontobdc-subject-page-avatar {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .68rem;
  font-weight: 800;
  background: color-mix(in srgb, var(--onto-theme-accent, #67e8f9) 22%, transparent);
  color: var(--onto-theme-accent, #67e8f9);
}
.ontobdc-subject-page-people-name { font-size: .8125rem; font-weight: 700; }
.ontobdc-subject-page-role-tag {
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 48%, transparent);
  margin-right: 6px;
}

.ontobdc-subject-page-empty {
  font-size: .8125rem;
  color: color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 48%, transparent);
}

  .ontobdc-subject-page-sidebar {

    border-bottom: 1px solid color-mix(in srgb, var(--onto-theme-foreground, #e5eefc) 20%, transparent);
    padding-right: 0;
    padding-bottom: .75rem;
  }
  .ontobdc-subject-page-detail { padding-left: 0; }
}

.gantt-right {

}

.gantt-table tbody tr {
  height: 28px;
}

.gantt-table tbody tr:hover {
  background: #f0f7ff;
}

.gantt-table td.col-wbs {
  width: 60px;

  font-family: monospace;
  font-size: 11px;
}

.gantt-table td.col-duration {
  width: 70px;
  text-align: right;
}

.gantt-table td.col-completion {
  width: 44px;

  color: #2c5282;
}

.gantt-timeline-header {
  height: 40px;

  top: 0;
  z-index: 2;
  background: var(--onto-theme-surface-alt, #f5f5f5);

}

svg.gantt-svg {
  display: block;
  overflow: visible;
}

.gantt-row-line {
  stroke: #eeeeee;
  stroke-width: 1;
}

.gantt-grid-col {
  stroke: #f3f3f3;
  stroke-width: 1;
}

.gantt-grid-col-major {
  stroke: #e0e0e0;
  stroke-width: 1;
}

.gantt-tick-label {
  font-size: 10px;
  fill: #666;
  font-family: sans-serif;
}

.gantt-bar {
  fill: var(--gantt-bar-fill, #3182ce);
  stroke: var(--gantt-bar-stroke, #2b6cb0);
  stroke-width: 1;

  ry: 2;

.gantt-bar-progress {

}

}

.gantt-bar-text {

  font-family: sans-serif;
  pointer-events: none;
}

.gantt-marker-diamond {

  stroke-width: 1;
}

.gantt-dependency-line {
  stroke: #333;
  stroke-width: 1.25;
  fill: none;

}

    return buildWorkStreamUri(workStreamId, namespace) + "/dimension";

      source.workStreamUri
      || buildWorkStreamUri(workStreamId, defaultNamespace),

    );

      }
      for (const key of Object.keys(node)) {
        const lowerKey = key.toLowerCase();
        const stripped = lowerKey.replace(/^.*#/, "").replace(/^.*\//, "");
        if (stripped.includes(idLower) || stripped.includes(idCamelLower)) {
          const val = node[key];
          const result = extractLiteral(val);
          if (result !== "") return result;
        }
      }
      return "";
    }

    function extractLiteral(val) {
      if (val === null || val === undefined) return "";
      if (typeof val === "string") return val;
      if (typeof val === "number" || typeof val === "boolean") return String(val);
      if (Array.isArray(val)) {
        for (const item of val) {
          const r = extractLiteral(item);
          if (r !== "") return r;
        }
        return "";
      }
      if (typeof val === "object") {
        if ("@value" in val) return extractLiteral(val["@value"]);
        if ("value" in val) return extractLiteral(val["value"]);
      }
      return "";
    }

    function anyLiteral(node, identifiers) {
      if (!node) return "";
      const list = Array.isArray(identifiers) ? identifiers : [identifiers];
      for (const id of list) {
        const v = literalValue(node, id);
        if (v !== "") return v;
      }
      return "";
    }

    const DC_ALIASES = {
      "Name": ["http://purl.org/dc/terms/title", "schema:name", "rdfs:label"],
      "Description": ["http://purl.org/dc/terms/description", "schema:description"],
      "Identification": ["http://purl.org/dc/terms/identifier", "schema:identifier"],
      "Title": ["http://purl.org/dc/terms/title", "schema:name"],
      "Identifier": ["http://purl.org/dc/terms/identifier", "schema:identifier"]
    };

    function aliasAwareLiteral(node, identifier) {
      const direct = literalValue(node, identifier);
      if (direct !== "") return direct;
      const aliases = DC_ALIASES[identifier] || DC_ALIASES[identifier.charAt(0).toUpperCase() + identifier.slice(1)] || [];
      for (const alias of aliases) {
        for (const key of Object.keys(node || {})) {
          if (key === alias || key.endsWith("#" + alias.split(":").pop()) || key.endsWith("/" + alias.split(":").pop()) || key.includes(alias)) {
            const r = extractLiteral(node[key]);
            if (r !== "") return r;
          }
        }
      }
      return "";
    }

    function referenceId(node) {
      if (!node) return "";
      if (typeof node === "string") return node;
      if (Array.isArray(node)) {
        for (const item of node) {
          const r = referenceId(item);
          if (r !== "") return r;
        }
        return "";
      }
      if (typeof node === "object") {
        if ("@id" in node) return node["@id"];
        if ("id" in node) return String(node["id"]);
      }
      return "";
    }

    function parseDate(str) {
      if (!str) return null;
      const s = String(str).trim();
      if (!s) return null;
      let d = new Date(s);
      if (!isNaN(d.getTime())) return d;
      const match = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (match) {
        d = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        if (!isNaN(d.getTime())) return d;
      }
      return null;
    }

    function formatDate(d) {
      if (!d) return "";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function diffDays(a, b) {
      if (!a || !b) return 0;
      const aDay = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
      const bDay = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
      return Math.round((bDay - aDay) / MILLIS_PER_DAY);
    }

    function getGlobalId(node) {
      return literalValue(node, "GlobalId") || literalValue(node, "globalId") || "";
    }

    const graph = parseJsonLd();

    const schedule = findByType(graph, IFC_WORK_SCHEDULE_TYPE)[0] || null;
    const rawTasks = findByType(graph, IFC_TASK_TYPES);
    const rawTaskTimes = findByType(graph, IFC_TASK_TIME_TYPES);
    const rawSequences = findByType(graph, IFC_REL_SEQUENCE_TYPES);

    const tasksByGlobalId = {};
    for (const t of rawTasks) {
      const gid = getGlobalId(t);
      if (gid) tasksByGlobalId[gid] = t;
    }

    const taskTimeByGlobalId = {};
    for (const tt of rawTaskTimes) {
      const gid = getGlobalId(tt);
      if (gid) taskTimeByGlobalId[gid] = tt;
    }

    const taskByTaskTimeGid = {};
    for (const t of rawTasks) {
      const taskTimeRef = anyLiteral(t, ["TaskTimeGlobalId", "TaskTime"]) || referenceId(t["TaskTime"] || t["taskTime"] || t["IfcTaskTime"] || null);
      const timeGidMatch = taskTimeRef.match(/([A-Za-z0-9_]{5,})/);
      let timeGid = timeGidMatch ? timeGidMatch[1] : "";
      if (!timeGid) {
        for (const ttGid of Object.keys(taskTimeByGlobalId)) {
          if (taskTimeRef.includes(ttGid)) {
            timeGid = ttGid;
            break;
          }
        }
      }
      if (timeGid) taskByTaskTimeGid[timeGid] = t;
    }

    const tasksByTimeRef = {};
    for (const t of rawTasks) {
      for (const candidateKey of ["TaskTime", "taskTime", "IfcTaskTime"]) {
        const refs = t[candidateKey];
        if (!refs) continue;
        const list = Array.isArray(refs) ? refs : [refs];
        for (const ref of list) {
          const refId = referenceId(ref);
          if (refId) {
            tasksByTimeRef[refId] = t;
            for (const ttGid of Object.keys(taskTimeByGlobalId)) {
              if (refId.includes(ttGid) || refId.endsWith(ttGid)) {
                taskByTaskTimeGid[ttGid] = t;
              }
            }
          }
        }
      }
    }

    for (const tt of rawTaskTimes) {
      const ttId = tt["@id"] || "";
      if (ttId && tasksByTimeRef[ttId]) {
        const t = tasksByTimeRef[ttId];
        const gid = getGlobalId(tt);
        if (gid && !taskByTaskTimeGid[gid]) {
          taskByTaskTimeGid[gid] = t;
        }
      }
    }

    const enrichedTasks = [];
    for (const task of rawTasks) {
      const globalId = getGlobalId(task);
      const identification = aliasAwareLiteral(task, "Identification") || aliasAwareLiteral(task, "Identifier") || "";
      const name = aliasAwareLiteral(task, "Name") || aliasAwareLiteral(task, "Title") || "";
      const description = aliasAwareLiteral(task, "Description") || "";

      let taskTime = null;
      for (const candidateKey of ["TaskTime", "taskTime", "IfcTaskTime", "TaskTimeGlobalId"]) {
        const refs = task[candidateKey];
        if (!refs) continue;
        const list = Array.isArray(refs) ? refs : [refs];
        for (const ref of list) {
          const refId = referenceId(ref) || extractLiteral(ref);
          for (const tt of rawTaskTimes) {
            const ttId = tt["@id"] || "";
            const ttGid = getGlobalId(tt);
            if ((refId && (ttId === refId || (ttGid && refId.includes(ttGid)))) ||
                (ttGid && taskByTaskTimeGid[ttGid] === task)) {
              taskTime = tt;
              break;
            }
          }
          if (taskTime) break;
        }
        if (taskTime) break;
      }
      if (!taskTime) {
        const ttGid = Object.keys(taskByTaskTimeGid).find((g) => taskByTaskTimeGid[g] === task);
        if (ttGid) taskTime = taskTimeByGlobalId[ttGid] || null;
      }

      let scheduleStart = taskTime ? parseDate(literalValue(taskTime, "ScheduleStart")) : null;
      let scheduleFinish = taskTime ? parseDate(literalValue(taskTime, "ScheduleFinish")) : null;
      const actualStart = taskTime ? parseDate(literalValue(taskTime, "ActualStart")) : null;
      const actualFinish = taskTime ? parseDate(literalValue(taskTime, "ActualFinish")) : null;
      let completionStr = taskTime ? literalValue(taskTime, "Completion") : "";
      if (completionStr === "") completionStr = taskTime ? literalValue(taskTime, "PercentComplete") : "";
      let completion = 0;
      if (completionStr !== "") {
        let num = parseFloat(String(completionStr).replace("%", ""));
        if (!isNaN(num)) {
          if (num > 0 && num < 1) num = num * 100;
          completion = Math.max(0, Math.min(100, num));
        }
      }
      const isMilestoneStrTask = anyLiteral(task, ["IsMilestone", "Milestone"]);
      const isMilestoneStrTT = taskTime ? (anyLiteral(taskTime, ["IsMilestone", "Milestone"]) || "") : "";
      const isMilestoneStr = isMilestoneStrTask !== "" ? isMilestoneStrTask : isMilestoneStrTT;
      let isMilestone = isMilestoneStr === "true" || isMilestoneStr === "1" || isMilestoneStr === "TRUE";
      const isCriticalStrTask = anyLiteral(task, ["IsCritical", "Critical"]);
      const isCriticalStrTT = taskTime ? (anyLiteral(taskTime, ["IsCritical", "Critical"]) || "") : "";
      const isCriticalStr = isCriticalStrTask !== "" ? isCriticalStrTask : isCriticalStrTT;
      let isCritical = isCriticalStr === "true" || isCriticalStr === "1" || isCriticalStr === "TRUE";

      let duration_days = 0;
      if (scheduleStart && scheduleFinish) {
        duration_days = diffDays(scheduleStart, scheduleFinish);
      }
      if (duration_days < 0) duration_days = 0;
      if (duration_days < 1 && isMilestone) {
        isMilestone = true;
      }
      if (duration_days === 0 && scheduleStart) {
        duration_days = 0.25;
        isMilestone = true;
      }

      enrichedTasks.push({
        globalId,
        identification,
        name,
        description,
        scheduleStart,
        scheduleFinish,
        actualStart,
        actualFinish,
        completion,
        isMilestone,
        isCritical,
        duration_days,
        raw: task,
        rawTime: taskTime
      });
    }

    enrichedTasks.sort((a, b) => {
      const ak = (a.identification || a.name || "").toString();
      const bk = (b.identification || b.name || "").toString();
      return ak.localeCompare(bk, undefined, { numeric: true, sensitivity: "base" });
    });

    const allDates = [];
    for (const task of enrichedTasks) {
      if (task.scheduleStart) allDates.push(task.scheduleStart);
      if (task.scheduleFinish) allDates.push(task.scheduleFinish);
    }
    if (schedule) {
      const sStart = parseDate(literalValue(schedule, "StartTime"));
      const sFinish = parseDate(literalValue(schedule, "FinishTime"));
      if (sStart) allDates.push(sStart);
      if (sFinish) allDates.push(sFinish);
    }

    let minDate = null;
    let maxDate = null;
    if (allDates.length > 0) {
      minDate = new Date(Math.min.apply(null, allDates.map((d) => d.getTime())));
      maxDate = new Date(Math.max.apply(null, allDates.map((d) => d.getTime())));
    }
    if (!minDate || !maxDate) {
      const today = new Date();
      minDate = new Date(today.getFullYear(), today.getMonth(), 1);
      maxDate = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    }
    minDate = new Date(minDate.getFullYear(), minDate.getMonth(), minDate.getDate());
    maxDate = new Date(maxDate.getFullYear(), maxDate.getMonth(), maxDate.getDate());

    const totalDays = Math.ceil((maxDate.getTime() - minDate.getTime()) / MILLIS_PER_DAY) + 1;
    const svgWidth = Math.max(800, totalDays * TICK_WIDTH_DAY);
    const svgHeight = HEADER_HEIGHT + enrichedTasks.length * ROW_HEIGHT;

    const tbody = document.getElementById("gantt-tbody");
    if (tbody) {
      for (let i = 0; i < enrichedTasks.length; i++) {
        const task = enrichedTasks[i];
        const tr = document.createElement("tr");
        const tdWbs = document.createElement("td");
        tdWbs.className = "col-wbs";
        tdWbs.textContent = task.identification || "";
        const tdName = document.createElement("td");
        tdName.className = "col-name";
        tdName.title = task.description || task.name || "";
        tdName.textContent = task.name || "";
        const tdStart = document.createElement("td");
        tdStart.className = "col-start";
        tdStart.textContent = formatDate(task.scheduleStart);
        const tdFinish = document.createElement("td");
        tdFinish.className = "col-finish";
        tdFinish.textContent = formatDate(task.scheduleFinish);
        const tdDuration = document.createElement("td");
        tdDuration.className = "col-duration";
        tdDuration.textContent = Math.max(0, task.duration_days).toFixed(task.duration_days % 1 === 0 ? 0 : 2) + "d";
        const tdCompletion = document.createElement("td");
        tdCompletion.className = "col-completion";
        tdCompletion.textContent = Math.round(task.completion) + "%";
        tr.appendChild(tdWbs);
        tr.appendChild(tdName);
        tr.appendChild(tdStart);
        tr.appendChild(tdFinish);
        tr.appendChild(tdDuration);
        tr.appendChild(tdCompletion);
        tbody.appendChild(tr);
      }
    }

    const svg = document.getElementById("gantt-svg");
    const timelineHeader = document.getElementById("gantt-timeline-header");
    if (svg) {
      svg.setAttribute("viewBox", `0 0 ${svgWidth} ${svgHeight}`);
      svg.setAttribute("width", svgWidth);
      svg.setAttribute("height", svgHeight);
    }

    function createSvgEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      if (attrs) {
        for (const k of Object.keys(attrs)) {
          el.setAttribute(k, attrs[k]);
        }
      }
      return el;
    }

    const taskIndexByGlobalId = {};
    for (let i = 0; i < enrichedTasks.length; i++) {
      if (enrichedTasks[i].globalId) {
        taskIndexByGlobalId[enrichedTasks[i].globalId] = i;
      }
    }

    const taskBarData = [];
    for (let i = 0; i < enrichedTasks.length; i++) {
      const task = enrichedTasks[i];
      const rowY = HEADER_HEIGHT + i * ROW_HEIGHT;
      const startOffsetDays = task.scheduleStart ? (task.scheduleStart.getTime() - minDate.getTime()) / MILLIS_PER_DAY : 0;
      const barX = startOffsetDays * TICK_WIDTH_DAY + 6;
      const durationDays = Math.max(0.25, task.duration_days);
      const barWidth = durationDays * TICK_WIDTH_DAY - 12;
      taskBarData.push({
        index: i,
        rowY,
        barX,
        barWidth,
        durationDays,
        task,
        isMilestone: task.isMilestone || durationDays < 0.5
      });
    }

    if (svg) {
      for (let d = 0; d <= totalDays; d++) {
        const x = d * TICK_WIDTH_DAY;
        const isMajor = d % 7 === 0;
        const line = createSvgEl("line", {
          x1: x,
          y1: HEADER_HEIGHT,
          x2: x,
          y2: svgHeight,
          class: isMajor ? "gantt-grid-col-major" : "gantt-grid-col"
        });
        svg.appendChild(line);
      }
    }

    if (svg) {
      for (let i = 0; i <= enrichedTasks.length; i++) {
        const y = HEADER_HEIGHT + i * ROW_HEIGHT;
        const line = createSvgEl("line", {
          x1: 0,
          y1: y,
          x2: svgWidth,
          y2: y,
          class: "gantt-row-line"
        });
        svg.appendChild(line);
      }
    }

    if (timelineHeader) {
      timelineHeader.style.width = svgWidth + "px";
      timelineHeader.style.position = "relative";

      const cur = new Date(minDate.getFullYear(), minDate.getMonth(), minDate.getDate());
      let lastMonthLabel = null;
      for (let d = 0; d < totalDays; d++) {
        const x = d * TICK_WIDTH_DAY;
        const dayNum = cur.getDate();
        const monthNum = cur.getMonth();
        const year = cur.getFullYear();

        if (dayNum === 1 || d === 0) {
          const monthName = cur.toLocaleString("default", { month: "short" });
          const monthLabel = document.createElement("div");
          monthLabel.style.position = "absolute";
          monthLabel.style.left = x + "px";
          monthLabel.style.top = "2px";
          monthLabel.style.fontSize = "11px";
          monthLabel.style.fontWeight = "600";
          monthLabel.style.color = "#333";
          monthLabel.style.paddingLeft = "4px";
          monthLabel.style.fontFamily = "sans-serif";
          monthLabel.style.whiteSpace = "nowrap";
          monthLabel.textContent = `${monthName} ${year}`;
          timelineHeader.appendChild(monthLabel);
          lastMonthLabel = { month: monthNum, year, x };
        }

        if (dayNum === 1 || dayNum === 15 || (dayNum % 7 === 0 && d > 0)) {
          const dayLabel = document.createElement("div");
          dayLabel.style.position = "absolute";
          dayLabel.style.left = (x + 2) + "px";
          dayLabel.style.top = "22px";
          dayLabel.style.fontSize = "10px";
          dayLabel.style.color = "#666";
          dayLabel.style.fontFamily = "sans-serif";
          dayLabel.style.whiteSpace = "nowrap";
          dayLabel.textContent = String(dayNum);
          timelineHeader.appendChild(dayLabel);
        }

        cur.setDate(cur.getDate() + 1);
      }
    }

    if (svg) {
      for (let i = 0; i < taskBarData.length; i++) {
        const data = taskBarData[i];
        const { rowY, barX, barWidth, isMilestone, task } = data;
        const centerY = rowY + ROW_HEIGHT / 2;
        const centerX = barX + barWidth / 2;

        if (isMilestone) {
          const size = 10;
          const pts = [
            [centerX, centerY - size],
            [centerX + size, centerY],
            [centerX, centerY + size],
            [centerX - size, centerY]
          ].map((p) => p.join(",")).join(" ");
          const diamond = createSvgEl("polygon", {
            points: pts,
            class: "gantt-marker-diamond"
          });
          svg.appendChild(diamond);

          if (task.name && barWidth > 20) {
            const text = createSvgEl("text", {
              x: centerX + size + 4,
              y: centerY + 4,
              class: "gantt-bar-text"
            });
            text.textContent = task.name;
            svg.appendChild(text);
          }
        } else {
          const barClasses = ["gantt-bar"];
          if (task.isCritical) barClasses.push("gantt-bar-critical");
          const bar = createSvgEl("rect", {
            x: barX,
            y: rowY + 6,
            width: barWidth,
            height: ROW_HEIGHT - 12,
            class: barClasses.join(" ")
          });
          svg.appendChild(bar);

          if (task.completion > 0) {
            const progressWidth = Math.max(0, (barWidth * task.completion) / 100);
            const progress = createSvgEl("rect", {
              x: barX,
              y: rowY + 6,
              width: progressWidth,
              height: ROW_HEIGHT - 12,
              class: "gantt-bar-progress"
            });
            svg.appendChild(progress);
          }

          if (task.name && barWidth > 60) {
            const text = createSvgEl("text", {
              x: barX + 4,
              y: rowY + 17,
              class: "gantt-bar-text"
            });
            const maxChars = Math.floor(barWidth / 6);
            text.textContent = task.name.length > maxChars ? task.name.substring(0, maxChars - 1) + "…" : task.name;
            svg.appendChild(text);
          }
        }
      }
    }

    function resolveSequenceGlobalId(ref) {
      if (!ref) return "";
      const refId = referenceId(ref);
      if (!refId) return "";
      if (taskIndexByGlobalId[refId] !== undefined) return refId;
      for (const gid of Object.keys(taskIndexByGlobalId)) {
        if (refId.includes(gid) || refId.endsWith("#" + gid) || refId.endsWith("/" + gid)) {
          return gid;
        }
      }
      for (const gid of Object.keys(taskIndexByGlobalId)) {
        const task = enrichedTasks[taskIndexByGlobalId[gid]];
        if (task && task.raw && task.raw["@id"] === refId) {
          return gid;
        }
      }
      const gidMatch = refId.match(/([A-Za-z0-9_]{5,})/);
      if (gidMatch && taskIndexByGlobalId[gidMatch[1]] !== undefined) {
        return gidMatch[1];
      }
      return "";
    }

    if (svg && rawSequences.length > 0) {
      for (const seq of rawSequences) {
        const relatingRef = anyLiteral(seq, ["RelatingProcess", "Predecessor"]) || referenceId(seq["RelatingProcess"] || seq["relatingProcess"] || seq["Predecessor"] || seq["predecessor"] || null);
        const relatedRef = anyLiteral(seq, ["RelatedProcess", "Successor"]) || referenceId(seq["RelatedProcess"] || seq["relatedProcess"] || seq["Successor"] || seq["successor"] || null);
        const predGid = resolveSequenceGlobalId(relatingRef);
        const succGid = resolveSequenceGlobalId(relatedRef);
        if (!predGid || !succGid) continue;
        const predIdx = taskIndexByGlobalId[predGid];
        const succIdx = taskIndexByGlobalId[succGid];
        if (predIdx === undefined || succIdx === undefined) continue;
        const predData = taskBarData[predIdx];
        const succData = taskBarData[succIdx];
        if (!predData || !succData) continue;

        const xPredEnd = predData.barX + predData.barWidth;
        const yPred = predData.rowY + ROW_HEIGHT / 2;
        const xSuccStart = succData.barX;
        const ySucc = succData.rowY + ROW_HEIGHT / 2;

        const gap = 15;
        const xMid = Math.max(xPredEnd + gap, xSuccStart - gap);
        let pathD;
        if (Math.abs(yPred - ySucc) < 2) {
          pathD = `M ${xPredEnd} ${yPred} L ${xSuccStart} ${ySucc}`;
        } else {
          const xMid1 = xPredEnd + gap;
          const xMid2 = xSuccStart - 4;
          pathD = `M ${xPredEnd} ${yPred} H ${xMid1} V ${ySucc} H ${xMid2}`;
        }
        const path = createSvgEl("path", {
          d: pathD,
          class: "gantt-dependency-line"
        });
        svg.appendChild(path);
      }
    }

    const leftPanel = document.querySelector(".gantt-left");
    const rightPanel = document.querySelector(".gantt-right");
    if (leftPanel && rightPanel) {
      let syncing = false;
      leftPanel.addEventListener("scroll", () => {
        if (syncing) return;
        syncing = true;
        rightPanel.scrollTop = leftPanel.scrollTop;
        requestAnimationFrame(() => { syncing = false; });
      });
      rightPanel.addEventListener("scroll", () => {
        if (syncing) return;
        syncing = true;
        leftPanel.scrollTop = rightPanel.scrollTop;
        requestAnimationFrame(() => { syncing = false; });
      });
    }
  });
})();

</script>

</body>
</html>
