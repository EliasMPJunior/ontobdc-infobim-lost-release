(() => {
  const DEFAULTS = {"lang":"en"};
  const NAMES = ["lang","theme"];

  const current = () => new URLSearchParams(location.search);

  // A control may already have painted a presentation choice before the URL
  // is normalized. Internal links must carry what the user is actually
  // seeing, even when that value is not present in the query string yet.
  function applied(name) {
    if (name === "lang") {
      return document.documentElement.lang
        || document.documentElement.dataset.language
        || null;
    }
    if (name === "theme") {
      return document.documentElement.dataset.theme || null;
    }
    return null;
  }

  // The address bar is the source of truth; DEFAULTS only answers for a
  // parameter the URL does not carry.
  const value = (name) => current().get(name) ?? DEFAULTS[name] ?? null;

  // Stamp every missing default into the address bar, so even the very first
  // open of a generated page is an explicit, shareable, reproducible URL
  // rather than one whose rendering depends on build-time knowledge.
  function ensureDefaults() {
    const url = new URL(location.href);
    let changed = false;
    for (const [name, defaultValue] of Object.entries(DEFAULTS)) {
      if (url.searchParams.has(name)) continue;
      url.searchParams.set(name, defaultValue);
      changed = true;
    }
    if (!changed) return;
    try {
      // Same-document rewrite: no reload, no extra history entry.
      history.replaceState(history.state, "", url.href);
    } catch {
      // Some browsers refuse replaceState with a URL on an opaque-origin
      // (file://) document. A replacing navigation reaches the same
      // normalized URL; the parameters are present on that load, so the
      // branch cannot run twice and cannot loop.
      location.replace(url.href);
    }
  }

  // Carry the live presentation state onto an internal link rather than
  // letting each component re-derive it. A parameter the link already
  // declares wins: inheriting must never overwrite an explicit choice, and
  // must never stamp a build-time default over the user's selection.
  function decorate(href) {
    try {
      const target = new URL(href, location.href);
      const params = current();
      for (const name of NAMES) {
        const carried = params.get(name) ?? applied(name);
        if (carried !== null && !target.searchParams.has(name)) {
          target.searchParams.set(name, carried);
        }
      }
      return target.href;
    } catch {
      return href;
    }
  }

  // The one place a presentation parameter is *changed*. Writing it into the
  // URL and navigating means page initialization re-derives the whole
  // rendering from the address bar, so a reload, a bookmark and a shared
  // link all reproduce it — and no Tile has to know how that is done.
  function withParam(name, value) {
    const url = new URL(location.href);
    url.searchParams.set(name, value);
    return url.href;
  }

  function select(name, value) {
    if (value === null || value === undefined || value === "") return false;
    let target;
    try {
      target = withParam(name, value);
    } catch {
      return false;
    }

    if (target === location.href) return false;
    try {
      // assign(), not replace(): the change stays undoable with Back.
      location.assign(target);
      return true;
    } catch {
      // Navigation refused (sandboxed frame, exotic scheme). The caller has
      // already applied the change in-document, so the control still works
      // for this session — it just will not survive the next reload.
      return false;
    }
  }

  // document is already in the URL's language at first paint instead of
  // flashing the language it was generated in.
  function applyLanguage() {
    const language = value("lang");
    if (!language) return;
    document.documentElement.lang = language;
    document.documentElement.dataset.language = language;
  }

  ensureDefaults();
  applyLanguage();

  window.ontobdcUrlState = {
    defaults: { ...DEFAULTS },
    names: [...NAMES],
    current,
    value,
    withParam,
    select,
    decorate,
    applyLanguage,
  };
})();

const PRESENTATION_EVENT_POLICY = "@prefix view: <http://datacenter.app.br/ontology/ontobdc/domain/view.ttl#> .\n@prefix event: <http://datacenter.app.br/ontology/ontobdc/abox/presentation_event.ttl#> .\n@prefix owl: <http://www.w3.org/2002/07/owl#> .\n\n# Presentation event definitions shipped with OntoBDC View.\nevent:SurfaceLoaded\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:PageLoaded .\n\nevent:EntityPageLoaded\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:PageLoaded .\n\nevent:PageLoaded\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:TileOpened\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:TileReady, event:SurfaceAreaFilled .\n\nevent:TileReady\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:SurfaceAreaFilled\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:TileClosed\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:TileStandby, event:SurfaceAreaEmptied .\n\nevent:TileStandby\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:SurfaceAreaEmptied\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:TileExpanded\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:TileResized, event:SurfaceAreaFilled .\n\nevent:TileCollapsed\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:TileResized, event:SurfaceAreaEmptied .\n\nevent:TileFullSized\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:SurfaceObscured .\n\nevent:SurfaceObscured\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:TileRestored\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:SurfaceRevealed .\n\nevent:SurfaceRevealed\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:TileResized\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:EntityPageOpenRequested\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:EntityPageRequested .\n\nevent:EntityPageRequested\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:EntityPageCloseRequested\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:EntityPageDismissRequested .\n\nevent:EntityPageDismissRequested\n    a owl:NamedIndividual, view:SharedEvent .\n\nevent:ComponentFileSingleClick\n    a owl:NamedIndividual, view:ComponentEvent .\n\nevent:ComponentFileDoubleClick\n    a owl:NamedIndividual, view:ComponentEvent ;\n    view:promotesTo event:EntityPageRequested .\n";

// The dDock Python package, as a self-installing source bundle.
const DOCK_RUNTIME_SOURCE = "# OntoBDC Web Dock runtime installer (generated, do not edit by hand).\nimport json as _json\nimport os as _os\nimport sys as _sys\n_ONTOBDC_DOCK_PACKAGE = 'ontobdc_web_dock'\n_ONTOBDC_DOCK_ROOT = _os.environ.get('ONTOBDC_DOCK_ROOT') or '/lib/ontobdc-web-dock'\n_ONTOBDC_DOCK_SOURCES = _json.loads(r\"\"\"{\"__init__.py\": \"\\\"\\\"\\\"Browser (Pyodide) Python runtime for the dDock Web presentation.\\n\\n``ontobdc-web-dock`` receives Component Events raised by the Web\\npresentation and runs, in Python, the semantic decision of *event\\npromotion*: it reads ``view:promotesTo`` from the presentation-event\\nontology and answers with every Shared Event a Component Event promotes\\nto.\\n\\nIt adds one new plugin type -- the **Listener** -- following OntoBDC's\\nexisting plugin, statechart and ontology conventions, but implemented\\nagainst nothing but the standard library and ``rdflib`` so it installs\\nand runs inside Pyodide.\\n\\\"\\\"\\\"\\n\\nfrom ontobdc_web_dock.bridge import WebDock, bootstrap, is_ready, promote\\n\\n__version__: str = \\\"0.1.0\\\"\\n\\n__all__ = [\\\"WebDock\\\", \\\"bootstrap\\\", \\\"promote\\\", \\\"is_ready\\\", \\\"__version__\\\"]\\n\", \"bridge.py\": \"\\\"\\\"\\\"The small, stable in-process interface the JavaScript/Pyodide bridge\\ncalls.\\n\\nThis module sits at the package root -- above the ``dock/`` clean\\narchitecture layers, the same place ontobdc-a3 keeps ``cli.py`` -- as the\\ncomposition root: it wires the outside caller (the JS bridge) to the\\nListener dispatch and does no domain work of its own.\\n\\nThe bridge exchanges JSON:\\n\\n    bootstrap(policy_turtle)                  -> {\\\"ready\\\": true, ...}\\n    promote('{\\\"event\\\": \\\"TileExpanded\\\", ...}') -> '{\\\"status\\\": \\\"...\\\",\\n                                                   \\\"targets\\\": [...], ...}'\\n\\nPython decides *what the event means*; JavaScript emits every event in\\n``targets``. Not coupled to the DOM.\\n\\\"\\\"\\\"\\n\\nimport json\\nfrom typing import Any, Dict, Optional\\n\\nfrom ontobdc_web_dock.dock.adapter.listener import (\\n    DockNotReadyError,\\n    PresentationEventDock,\\n)\\nfrom ontobdc_web_dock.dock.adapter.policy import PromotionPolicy\\n\\n_DOCK: Optional[PresentationEventDock] = None\\n\\n\\ndef bootstrap(policy_turtle: str) -> Dict[str, Any]:\\n    \\\"\\\"\\\"Parse and index the promotion policy once for the page's lifetime.\\n\\n    ``policy_turtle`` is the ``presentation_event.ttl`` document itself,\\n    handed over by the bridge -- the browser cannot reach the\\n    brasidatacenter package the document is published in, so the document\\n    travels with the page instead of the policy being restated in code.\\n    \\\"\\\"\\\"\\n    global _DOCK\\n    policy = PromotionPolicy.from_turtle(policy_turtle)\\n    _DOCK = PresentationEventDock(policy)\\n    return {\\n        \\\"ready\\\": True,\\n        \\\"listeners\\\": _DOCK.listener_ids(),\\n        \\\"componentEvents\\\": policy.component_event_names(),\\n        \\\"sharedEvents\\\": policy.shared_event_names(),\\n    }\\n\\n\\ndef is_ready() -> bool:\\n    return _DOCK is not None\\n\\n\\ndef promote(envelope_json: Any) -> str:\\n    \\\"\\\"\\\"JSON in, JSON out -- the shape the Pyodide bridge exchanges.\\n\\n    Returns every Shared Event the policy promotes the occurrence to:\\n    ``[]``, one target, or many.\\n    \\\"\\\"\\\"\\n    if _DOCK is None:\\n        raise DockNotReadyError(\\n            \\\"the presentation event dock has not been bootstrapped with a \\\"\\n            \\\"policy graph\\\"\\n        )\\n    try:\\n        envelope = (\\n            json.loads(envelope_json)\\n            if isinstance(envelope_json, str)\\n            else dict(envelope_json or {})\\n        )\\n    except (TypeError, ValueError) as error:\\n        raise DockNotReadyError(\\n            f\\\"unreadable Component Event envelope: {error}\\\"\\n        ) from error\\n    return json.dumps(_DOCK.promote(envelope), ensure_ascii=False)\\n\\n\\nclass WebDock:\\n    \\\"\\\"\\\"Object-style facade over ``bootstrap`` / ``promote`` for callers\\n    that hold their own policy (tests, embedders).\\n\\n    The browser bridge uses the module-level ``bootstrap`` / ``promote``\\n    functions directly; this class is the ergonomic equivalent for\\n    in-process Python callers.\\n    \\\"\\\"\\\"\\n\\n    def __init__(self, policy_turtle: Optional[str] = None) -> None:\\n        self._dock: Optional[PresentationEventDock] = None\\n        if policy_turtle is not None:\\n            self.bootstrap(policy_turtle)\\n\\n    def bootstrap(self, policy_turtle: str) -> Dict[str, Any]:\\n        policy = PromotionPolicy.from_turtle(policy_turtle)\\n        self._dock = PresentationEventDock(policy)\\n        return {\\n            \\\"ready\\\": True,\\n            \\\"listeners\\\": self._dock.listener_ids(),\\n            \\\"componentEvents\\\": policy.component_event_names(),\\n            \\\"sharedEvents\\\": policy.shared_event_names(),\\n        }\\n\\n    def promote(self, event: Any) -> Dict[str, Any]:\\n        if self._dock is None:\\n            raise DockNotReadyError(\\\"WebDock was not bootstrapped with a policy\\\")\\n        envelope = (\\n            event\\n            if isinstance(event, dict)\\n            else {\\\"event\\\": str(event)}\\n        )\\n        return self._dock.promote(envelope)\\n\", \"dock/__init__.py\": \"\\\"\\\"\\\"dDock presentation-event runtime -- the Python authority over promotion.\\n\\nTwo hard constraints shape every module here:\\n\\n1. **Pyodide-only dependencies.** Nothing but the standard library and\\n   ``rdflib``. No ``ontobdc``, no ``sismic``, no ``pydantic`` -- the\\n   bridge ships these modules as source text and executes them in\\n   Pyodide.\\n2. **No promotion policy in code.** The policy lives in\\n   brasidatacenter's ``ontology/tool/ontobdc/abox/presentation_event.ttl``\\n   and is read as RDF through ``view:promotesTo``. Nothing here\\n   enumerates, mirrors or special-cases a Component -> Shared mapping.\\n\\\"\\\"\\\"\\n\\nfrom ontobdc_web_dock.dock.adapter.listener import PresentationEventDock\\nfrom ontobdc_web_dock.dock.adapter.policy import PromotionPolicy\\nfrom ontobdc_web_dock.dock.domain.machine.promotion_state import (\\n    EventPromotionProcessState,\\n)\\nfrom ontobdc_web_dock.dock.domain.port.listener import (\\n    ListenerMetadata,\\n    ListenerPort,\\n)\\n\\n__all__ = [\\n    \\\"EventPromotionProcessState\\\",\\n    \\\"ListenerMetadata\\\",\\n    \\\"ListenerPort\\\",\\n    \\\"PresentationEventDock\\\",\\n    \\\"PromotionPolicy\\\",\\n]\\n\", \"dock/adapter/__init__.py\": \"\", \"dock/adapter/listener.py\": \"\\\"\\\"\\\"Dispatch an occurrence to the discovered Listener.\\n\\nThe Listener counterpart of ``CliCommandRunAdapter``: discover the\\nplugins through the loader and hand the envelope to the one registered\\nfor presentation-event promotion. Holds the indexed policy for the life\\nof the page so every interaction is a dictionary lookup.\\n\\\"\\\"\\\"\\n\\nfrom typing import Any, Dict, List, Optional\\n\\nfrom ontobdc_web_dock.dock.adapter.loader import ListenerLoader\\nfrom ontobdc_web_dock.dock.adapter.policy import PromotionPolicy\\nfrom ontobdc_web_dock.dock.domain.port.listener import ListenerPort\\n\\n\\nclass DockNotReadyError(RuntimeError):\\n    \\\"\\\"\\\"``promote()`` was called before the policy was loaded.\\n\\n    The bridge queues occurrences until bootstrap completes rather than\\n    guessing an answer, so this is an explicit programming error, never a\\n    prompt to fall back to a JavaScript decision.\\n    \\\"\\\"\\\"\\n\\n\\nclass PresentationEventDock:\\n    \\\"\\\"\\\"Holds the indexed policy and the discovered Listener plugins.\\\"\\\"\\\"\\n\\n    LISTENER_ID = (\\n        \\\"org.ontobdc.web_dock.dock.plugin.listener.presentation_event_promotion\\\"\\n    )\\n\\n    def __init__(\\n        self,\\n        policy: PromotionPolicy,\\n        loader: Optional[ListenerLoader] = None,\\n    ) -> None:\\n        self._policy = policy\\n        self._loader = loader or ListenerLoader()\\n        self._listeners: Dict[str, ListenerPort] = {}\\n        for listener_class in self._loader.get_all():\\n            self._listeners[listener_class.METADATA.id] = listener_class(policy)\\n\\n    @property\\n    def policy(self) -> PromotionPolicy:\\n        return self._policy\\n\\n    def listener_ids(self) -> List[str]:\\n        return sorted(self._listeners)\\n\\n    def listener(self, listener_id: Optional[str] = None) -> ListenerPort:\\n        resolved = listener_id or self.LISTENER_ID\\n        try:\\n            return self._listeners[resolved]\\n        except KeyError as error:\\n            raise DockNotReadyError(\\n                f\\\"no dDock Listener plugin is registered under {resolved!r}; \\\"\\n                f\\\"discovered: {self.listener_ids()}\\\"\\n            ) from error\\n\\n    def promote(self, envelope: Dict[str, Any]) -> Dict[str, Any]:\\n        return self.listener().handle(envelope or {})\\n\", \"dock/adapter/loader.py\": \"\\\"\\\"\\\"Listener plugin discovery.\\n\\nSame convention as ``ontobdc.shared.adapter.loader``: walk the\\n``<domain>/plugin/<resource>/`` package, import every module found, and\\ncollect the classes that declare a ``METADATA`` of the resource's\\nmetadata type. Nothing is registered by hand -- dropping a new Listener\\nmodule into ``ontobdc_web_dock/dock/plugin/listener/`` is enough to have\\nit found.\\n\\n``ontobdc.shared.adapter.loader.PluginLoader`` itself is *not* reused\\nhere: it resolves plugin roots through ``ConfigDataAdapter`` and drags in\\nthe ``ontobdc`` distribution, which is not installed in Pyodide. The walk\\nis therefore reimplemented against ``pkgutil`` / ``importlib`` only --\\nthe convention is shared, the machinery is the runtime-appropriate one.\\n\\\"\\\"\\\"\\n\\nimport importlib\\nimport pkgutil\\nfrom typing import Any, List, Optional, Type\\n\\nfrom ontobdc_web_dock.dock.domain.port.listener import (\\n    ListenerMetadata,\\n    ListenerPort,\\n)\\n\\n_RESOURCE = \\\"listener\\\"\\n_PLUGIN_PACKAGE = \\\"ontobdc_web_dock.dock.plugin\\\"\\n\\n\\nclass ListenerLoader:\\n    def __init__(self, plugin_package: str = _PLUGIN_PACKAGE) -> None:\\n        self._plugin_package = plugin_package\\n\\n    def get_all(\\n        self, resource: str = _RESOURCE\\n    ) -> List[Type[ListenerPort]]:\\n        listeners: List[Type[ListenerPort]] = []\\n        seen = set()\\n\\n        try:\\n            resource_package = importlib.import_module(\\n                f\\\"{self._plugin_package}.{resource}\\\"\\n            )\\n        except ImportError:\\n            return listeners\\n\\n        if not hasattr(resource_package, \\\"__path__\\\"):\\n            return listeners\\n\\n        prefix = resource_package.__name__ + \\\".\\\"\\n        for _, module_name, _ in pkgutil.iter_modules(\\n            resource_package.__path__, prefix\\n        ):\\n            try:\\n                module = importlib.import_module(module_name)\\n            except ImportError:\\n                continue\\n            for attribute in vars(module).values():\\n                if not isinstance(attribute, type):\\n                    continue\\n                if (\\n                    not issubclass(attribute, ListenerPort)\\n                    or attribute is ListenerPort\\n                ):\\n                    continue\\n                metadata: Any = getattr(attribute, \\\"METADATA\\\", None)\\n                if not isinstance(metadata, ListenerMetadata) or not metadata.id:\\n                    continue\\n                if metadata.id in seen:\\n                    continue\\n                seen.add(metadata.id)\\n                listeners.append(attribute)\\n\\n        return listeners\\n\\n    def get(\\n        self, id: str, resource: str = _RESOURCE\\n    ) -> Optional[Type[ListenerPort]]:\\n        for listener in self.get_all(resource):\\n            if listener.METADATA.id == id:\\n                return listener\\n        return None\\n\", \"dock/adapter/machine.py\": \"\\\"\\\"\\\"The event-promotion statechart, run as one linear pass.\\n\\n``ontobdc``'s ``StateWorkerAdapter`` drives its statecharts through\\n``sismic`` off a YAML file. That whole stack (sismic + the ontobdc\\ndistribution) is not available in Pyodide, so this pass is the same\\nstatechart expressed directly: the enum in\\n``domain.machine.promotion_state`` is the state set, and this adapter is\\nthe ``adapter/machine`` that walks it, appending each state reached to a\\ntrace exactly as the cumulative-state convention prescribes.\\n\\nEvery transition is unconditional except the one out of\\n``SEMANTIC_EVENT_RESOLVED``: a name that is not a ``view:ComponentEvent``\\nin the policy graph ends the pass there.\\n\\\"\\\"\\\"\\n\\nfrom typing import Dict, List, Optional, Tuple\\n\\nfrom rdflib import URIRef\\n\\nfrom ontobdc_web_dock.dock.adapter.policy import PromotionPolicy\\nfrom ontobdc_web_dock.dock.domain.machine.promotion_state import (\\n    EventPromotionProcessState as _STATE,\\n)\\n\\n\\nclass EventPromotionMachine:\\n    \\\"\\\"\\\"Runs one promotion pass against an indexed policy.\\\"\\\"\\\"\\n\\n    def __init__(self, policy: PromotionPolicy) -> None:\\n        self._policy = policy\\n\\n    def run(\\n        self, occurrence_name: str\\n    ) -> Tuple[\\n        Optional[URIRef],\\n        Tuple[URIRef, ...],\\n        List[_STATE],\\n    ]:\\n        \\\"\\\"\\\"Return ``(component_event_iri, targets, trace)``.\\n\\n        ``component_event_iri`` is ``None`` when the occurrence name is not\\n        a Component Event in the policy; ``targets`` is then empty.\\n        \\\"\\\"\\\"\\n        trace: List[_STATE] = [_STATE.EVENT_RECEIVED]\\n\\n        name = str(occurrence_name or \\\"\\\").strip()\\n        component_event = self._policy.resolve_component_event(name)\\n        trace.append(_STATE.SEMANTIC_EVENT_RESOLVED)\\n\\n        if component_event is None:\\n            trace.append(_STATE.RESPONSE_PRODUCED)\\n            return None, (), trace\\n\\n        targets = self._policy.promotion_targets(component_event)\\n        trace.append(_STATE.PROMOTION_POLICY_EVALUATED)\\n        trace.append(_STATE.PROMOTION_TARGETS_RESOLVED)\\n        trace.append(_STATE.RESPONSE_PRODUCED)\\n        return component_event, targets, trace\\n\\n    @staticmethod\\n    def trace_state(trace: List[_STATE]) -> str:\\n        return trace[-1].value if trace else _STATE.UNDEFINED.value\\n\\n    @staticmethod\\n    def trace_names(trace: List[_STATE]) -> List[str]:\\n        return _STATE.trace_names(trace)\\n\", \"dock/adapter/policy.py\": \"\\\"\\\"\\\"Reads the promotion policy out of RDF and indexes it once.\\n\\nThe policy is Brasidata/brasidatacenter's\\n``ontology/tool/ontobdc/abox/presentation_event.ttl``. This adapter parses\\nthat Turtle document with rdflib and builds an in-memory index of\\n``view:promotesTo``, so a Tile interaction costs a dictionary lookup\\nrather than a re-parse or a SPARQL evaluation per event.\\n\\n``view:promotesTo`` is a **multivalued** relation: one Component Event\\nmay promote to zero, one or many Shared Events. Every read here goes\\nthrough ``Graph.objects(...)``, which yields all objects. An API that\\ncollapses a predicate to a single object -- ``Graph.value(...)`` and\\nanything equivalent -- would silently drop the second target of\\n``TileOpened`` and is never used.\\n\\\"\\\"\\\"\\n\\nfrom typing import Dict, List, Optional, Tuple\\n\\nfrom rdflib import Graph, Namespace, URIRef\\nfrom rdflib.namespace import RDF\\n\\nVIEW = Namespace(\\\"http://datacenter.app.br/ontology/ontobdc/domain/view.ttl#\\\")\\nEVENT = Namespace(\\n    \\\"http://datacenter.app.br/ontology/ontobdc/abox/presentation_event.ttl#\\\"\\n)\\n\\nPROMOTES_TO = VIEW.promotesTo\\nCOMPONENT_EVENT = VIEW.ComponentEvent\\nSHARED_EVENT = VIEW.SharedEvent\\n\\n\\nclass PromotionPolicyError(Exception):\\n    \\\"\\\"\\\"The policy document could not be read as RDF.\\\"\\\"\\\"\\n\\n\\ndef local_name(iri: URIRef) -> str:\\n    \\\"\\\"\\\"The event name a browser Component/Shared Event carries.\\n\\n    The event individuals are minted in the ``presentation_event.ttl#``\\n    namespace, so the name is whatever follows it. Falls back to the last\\n    ``#`` / ``/`` segment for an individual minted elsewhere.\\n    \\\"\\\"\\\"\\n    text = str(iri)\\n    if text.startswith(str(EVENT)):\\n        return text[len(str(EVENT)):]\\n    for separator in (\\\"#\\\", \\\"/\\\"):\\n        if separator in text:\\n            return text.rsplit(separator, 1)[-1]\\n    return text\\n\\n\\nclass PromotionPolicy:\\n    \\\"\\\"\\\"An indexed, read-only view of the presentation promotion policy.\\n\\n    Build it once per runtime (the dDock keeps a single instance for the\\n    life of the page) and answer every interaction from the index.\\n    \\\"\\\"\\\"\\n\\n    def __init__(self, graph: Graph) -> None:\\n        self._graph = graph\\n        self._component_events: Dict[str, URIRef] = {}\\n        self._shared_events: Dict[str, URIRef] = {}\\n        self._promotions: Dict[URIRef, Tuple[URIRef, ...]] = {}\\n        self._index()\\n\\n    # ---- construction --------------------------------------------------\\n\\n    @classmethod\\n    def from_turtle(cls, turtle: str) -> \\\"PromotionPolicy\\\":\\n        \\\"\\\"\\\"Parse a Turtle policy document -- the form the browser bridge\\n        hands to the runtime, since Pyodide has no access to the\\n        brasidatacenter package the document is published in.\\\"\\\"\\\"\\n        graph = Graph()\\n        try:\\n            graph.parse(data=turtle, format=\\\"turtle\\\")\\n        except Exception as error:  # rdflib raises a family of parse errors\\n            raise PromotionPolicyError(\\n                f\\\"presentation event policy is not readable as Turtle: {error}\\\"\\n            ) from error\\n        return cls(graph)\\n\\n    def _index(self) -> None:\\n        for subject in self._graph.subjects(RDF.type, COMPONENT_EVENT):\\n            if not isinstance(subject, URIRef):\\n                continue\\n            self._component_events[local_name(subject)] = subject\\n            targets = sorted(\\n                (\\n                    target\\n                    for target in self._graph.objects(subject, PROMOTES_TO)\\n                    if isinstance(target, URIRef)\\n                ),\\n                key=str,\\n            )\\n            self._promotions[subject] = tuple(targets)\\n\\n        for subject in self._graph.subjects(RDF.type, SHARED_EVENT):\\n            if isinstance(subject, URIRef):\\n                self._shared_events[local_name(subject)] = subject\\n\\n    # ---- queries -----------------------------------------------------\\n\\n    @property\\n    def graph(self) -> Graph:\\n        return self._graph\\n\\n    def component_event_names(self) -> List[str]:\\n        return sorted(self._component_events)\\n\\n    def shared_event_names(self) -> List[str]:\\n        return sorted(self._shared_events)\\n\\n    def resolve_component_event(self, name: str) -> Optional[URIRef]:\\n        \\\"\\\"\\\"The ``view:ComponentEvent`` individual an occurrence name\\n        denotes, or ``None`` when the name is not a Component Event in this\\n        policy.\\\"\\\"\\\"\\n        return self._component_events.get(str(name or \\\"\\\").strip())\\n\\n    def promotion_targets(\\n        self, component_event: URIRef\\n    ) -> Tuple[URIRef, ...]:\\n        \\\"\\\"\\\"Every ``view:promotesTo`` object of ``component_event``.\\n\\n        Returns an empty tuple when the Component Event declares no\\n        promotion -- a normal, non-error outcome.\\n        \\\"\\\"\\\"\\n        return self._promotions.get(component_event, ())\\n\\n    def is_shared_event(self, iri: URIRef) -> bool:\\n        return iri in set(self._shared_events.values())\\n\", \"dock/domain/__init__.py\": \"\", \"dock/domain/machine/__init__.py\": \"\", \"dock/domain/machine/promotion_state.py\": \"\\\"\\\"\\\"Statechart states for one dDock promotion pass.\\n\\nMirrors the cumulative-state convention every OntoBDC process statechart\\nuses (`WorkStreamScriptGenerationProcessState`, ...): a ``str`` enum whose\\nmembers are the states reached, in order, with ``label()`` /\\n``description()``. It is a plain ``enum.Enum`` over ``str`` -- not an\\n``ontobdc`` port subclass -- because this module runs inside Pyodide,\\nwhere ``ontobdc`` is not installed.\\n\\nThe run is linear and cumulative -- the state a pass ends in tells you\\nhow far it got:\\n\\n    EVENT_RECEIVED\\n        -> SEMANTIC_EVENT_RESOLVED\\n            -> PROMOTION_POLICY_EVALUATED\\n                -> PROMOTION_TARGETS_RESOLVED\\n                    -> RESPONSE_PRODUCED\\n\\n``SEMANTIC_EVENT_RESOLVED`` is the branch point: an occurrence name that\\nis not a ``view:ComponentEvent`` in the policy graph stops there and goes\\nstraight to ``RESPONSE_PRODUCED`` with no targets. A Component Event that\\ncarries no ``view:promotesTo`` still runs the whole chain and produces an\\nempty target list -- absence of a promotion is a normal outcome, never an\\nerror.\\n\\\"\\\"\\\"\\n\\nfrom enum import Enum\\nfrom typing import List\\n\\n\\nclass EventPromotionProcessState(str, Enum):\\n    UNDEFINED = \\\"__undefined__\\\"\\n    EVENT_RECEIVED = \\\"__event_received__\\\"\\n    SEMANTIC_EVENT_RESOLVED = \\\"__semantic_event_resolved__\\\"\\n    PROMOTION_POLICY_EVALUATED = \\\"__promotion_policy_evaluated__\\\"\\n    PROMOTION_TARGETS_RESOLVED = \\\"__promotion_targets_resolved__\\\"\\n    RESPONSE_PRODUCED = \\\"__response_produced__\\\"\\n\\n    def label(self, lang: str = \\\"en\\\") -> str:\\n        labels = {\\n            \\\"en\\\": {\\n                self.UNDEFINED: \\\"Undefined\\\",\\n                self.EVENT_RECEIVED: \\\"Event Received\\\",\\n                self.SEMANTIC_EVENT_RESOLVED: \\\"Semantic Event Resolved\\\",\\n                self.PROMOTION_POLICY_EVALUATED: \\\"Promotion Policy Evaluated\\\",\\n                self.PROMOTION_TARGETS_RESOLVED: \\\"Promotion Targets Resolved\\\",\\n                self.RESPONSE_PRODUCED: \\\"Response Produced\\\",\\n            },\\n            \\\"pt-br\\\": {\\n                self.UNDEFINED: \\\"Indefinido\\\",\\n                self.EVENT_RECEIVED: \\\"Evento Recebido\\\",\\n                self.SEMANTIC_EVENT_RESOLVED: \\\"Evento Semantico Resolvido\\\",\\n                self.PROMOTION_POLICY_EVALUATED: \\\"Politica de Promocao Avaliada\\\",\\n                self.PROMOTION_TARGETS_RESOLVED: \\\"Destinos de Promocao Resolvidos\\\",\\n                self.RESPONSE_PRODUCED: \\\"Resposta Produzida\\\",\\n            },\\n        }\\n        return labels.get(lang, labels[\\\"en\\\"]).get(self, self.value)\\n\\n    def description(self, lang: str = \\\"en\\\") -> str:\\n        descriptions = {\\n            \\\"en\\\": {\\n                self.UNDEFINED: \\\"No promotion pass has started.\\\",\\n                self.EVENT_RECEIVED: (\\n                    \\\"The dDock accepted a Component Event envelope from the \\\"\\n                    \\\"browser bridge.\\\"\\n                ),\\n                self.SEMANTIC_EVENT_RESOLVED: (\\n                    \\\"The envelope's occurrence name was resolved against the \\\"\\n                    \\\"policy graph to a view:ComponentEvent individual, or \\\"\\n                    \\\"found not to be one.\\\"\\n                ),\\n                self.PROMOTION_POLICY_EVALUATED: (\\n                    \\\"view:promotesTo was read from the policy graph for the \\\"\\n                    \\\"resolved Component Event.\\\"\\n                ),\\n                self.PROMOTION_TARGETS_RESOLVED: (\\n                    \\\"Every promotesTo object was resolved to a Shar const PYODIDE_CDN_URL = "https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js";

const HOST_RUNTIME_KEYS = [
  "OntoBDCWorkStreamViewRuntime",
  "OntoBDCGanttViewRuntime",
  "OntoBDCEntityViewRuntime",
];

function hostRuntime() {
  for (const key of HOST_RUNTIME_KEYS) {
    const candidate = window[key];
    if (candidate && typeof candidate.ensurePyodide === "function") return candidate;
  }
  return null;
}

function loadScriptTag(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`Failed to load ${src}`));
    document.head.appendChild(script);
  });
}

async function ownPyodide() {
  if (typeof loadPyodide !== "function") {
    await loadScriptTag(PYODIDE_CDN_URL);
  }
  const instance = await loadPyodide();
  await instance.loadPackage("micropip");
  await instance.runPythonAsync("import micropip\nawait micropip.install('rdflib')");
  return instance;
}

class ComponentEventPromoter {
  #promote = null;
  #bootstrapPromise = null;
  #pending = [];
  #failure = null;
  #draining = false;

  get ready() { return this.#promote !== null; }
  get pendingCount() { return this.#pending.length; }
  get failure() { return this.#failure; }

  bootstrap() {
    if (this.#bootstrapPromise) return this.#bootstrapPromise;
    log("bootstrap: starting");
    this.#bootstrapPromise = (async () => {
      const host = hostRuntime();
      log("bootstrap: pyodide via", host ? "host runtime" : "own loadPyodide");
      const pyodide = host ? await host.ensurePyodide() : await ownPyodide();
      const withLock =
        host && typeof host.withPyodideLock === "function"
          ? host.withPyodideLock
          : (task) => task();
      const promote = await withLock(async () => {
        log("bootstrap: installing ontobdc_web_dock into Pyodide");
        await pyodide.runPythonAsync(DOCK_RUNTIME_SOURCE);
        const runtimeModule = pyodide.globals.get("ontobdc_web_dock");
        if (!runtimeModule) {
          throw new Error("ontobdc_web_dock runtime did not install in Pyodide");
        }
        log("bootstrap: runtime installed; parsing policy");
        const info = pyToJs(runtimeModule.bootstrap(PRESENTATION_EVENT_POLICY));
        // <-- Python -> JS: what the Listener knows after bootstrap.
        log("bootstrap: Python returned", info);
        return runtimeModule.promote;
      });
      this.#promote = promote;
      this.#failure = null;
      log("bootstrap: ready");
      return promote;
    })();
    this.#bootstrapPromise.catch((error) => {
      this.#failure = error;
      this.#bootstrapPromise = null;
      console.error("[dDock] promotion runtime unavailable", error);
      announceFailure(error);
    });
    return this.#bootstrapPromise;
  }

  accept(occurrence) {
    log("accept: component event", occurrence.envelope.event, occurrence.envelope);
    this.#pending.push(occurrence);
    return this.#drain();
  }

  async #drain() {
    if (this.#draining) return;
    this.#draining = true;
    try {
      while (this.#pending.length) {
        if (!this.ready) {
          try { await this.bootstrap(); }
          catch (error) { log("drain: bootstrap failed, keeping queue", error); return; }
        }
        const occurrence = this.#pending.shift();
        try { await this.#resolveAndDispatch(occurrence); }
        catch (error) {
          console.error("[dDock] the Listener could not answer", occurrence.envelope, error);
        }
      }
    } finally {
      this.#draining = false;
    }
  }

  async #resolveAndDispatch(occurrence) {
    log("promote: ->", occurrence.envelope);
    const raw = this.#promote(JSON.stringify(occurrence.envelope));
    // <-- Python -> JS: the Listener's answer, as a JSON string.
    log("promote: <- (raw)", raw);
    const answer = JSON.parse(raw);
    log(
      "promote: <- (parsed)",
      "status=" + answer.status,
      "targets=" + JSON.stringify(answer.targets),
      "trace=" + JSON.stringify(answer.trace),
    );
    const targets = Array.isArray(answer.targets) ? answer.targets : [];
    if (targets.length === 0) {
      log("promote: no targets ->", occurrence.envelope.event, "is not promoted");
    }
    for (const target of targets) {
      log("dispatch: shared event", target.event, "(promoted from", answer.componentEvent + ")");
      announcePromotion(occurrence, answer, target);
      dispatchSharedEvent(occurrence, answer, target);
    }
    return answer;
  }
}

const promoter = new ComponentEventPromoter();

function promotionDisplay(occurrence) {
  const surface = occurrence.surface;
  if (surface && typeof surface.announcePromotion === "function") return surface;
  const pageDisplay = window.OntoBDCPageEventDisplay;
  if (pageDisplay && typeof pageDisplay.announcePromotion === "function") return pageDisplay;
  return null;
}

function announcePromotion(occurrence, answer, target) {
  const display = promotionDisplay(occurrence);
  if (!display) return;
  display.announcePromotion({
    sharedEvent: target.event,
    sharedEventIri: target.iri,
    componentEvent: answer.componentEvent,
    componentEventIri: answer.componentEventIri,
    detail: occurrence.envelope.detail,
  });
}

function announceFailure(error) {
  for (const surface of document.querySelectorAll("onto-presentation-surface")) {
    if (typeof surface.announcePromotionFailure === "function") {
      surface.announcePromotionFailure(error);
    }
  }
  const pageDisplay = window.OntoBDCPageEventDisplay;
  if (pageDisplay && typeof pageDisplay.announcePromotionFailure === "function") {
    pageDisplay.announcePromotionFailure(error);
  }
}

function dispatchSharedEvent(occurrence, answer, target) {
  const detail = {
    ...(occurrence.envelope.detail || {}),
    event: target.event,
    eventIri: target.iri,
    promotedFrom: answer.componentEvent,
    promotedFromIri: answer.componentEventIri,
  };
  const node = occurrence.surface || document;
  log("dispatchSharedEvent:", SHARED_EVENT_TYPE, "on", node === document ? "document" : node, detail);
  node.dispatchEvent(
    new CustomEvent(SHARED_EVENT_TYPE, { bubbles: true, composed: true, detail }),
  );
}

function owningSurface(target) {
  if (!(target instanceof Element)) return null;
  const direct = target.closest("onto-presentation-surface");
  if (direct) return direct;
  const root = target.getRootNode?.();
  if (root && root.host instanceof Element) {
    return root.host.closest("onto-presentation-surface") ?? null;
  }
  return null;
}

const ONCE_KEY = Symbol.for("ontobdc.component-event-promoter.attached");
if (!document[ONCE_KEY]) {
  document[ONCE_KEY] = true;
  document.addEventListener(COMPONENT_EVENT_TYPE, (event) => {
    const detail = event.detail || {};
    const name = String(detail.event || "").trim();
    log("received", COMPONENT_EVENT_TYPE, "name=" + (name || "<empty>"), "target=", event.target, detail);
    if (!name) {
      log("ignored: envelope carried no detail.event");
      return;
    }
    const surface = owningSurface(event.target);
    log("resolved owning surface:", surface || "<none>");
    promoter.accept({
      surface,
      origin: event.target,
      envelope: { event: name, detail },
    });
  });
  const warm = () => promoter.bootstrap().catch(() => {});
  if (typeof requestIdleCallback === "function") requestIdleCallback(warm);
  else setTimeout(warm, 0);
}

window.OntoBDCComponentEventPromoter = promoter;
document.dispatchEvent(new CustomEvent("ontobdc:component-event-promoter-ready"));

// (`ontobdc_view.component.adapter.surface_layout_selection`) they mirror.
// Every OntoBDC renderer measuring the same logical capacity must pick the
// same candidate, so this is intentionally a straight port, not a
// reinterpretation.
function candidateMatchesCapacity(candidate, capacity) {
  if (isContradictoryCandidate(candidate)) return false;
  const columnsOk =
    (candidate.minAvailableColumns == null || candidate.minAvailableColumns <= capacity.columns)
    && (candidate.maxAvailableColumns == null || candidate.maxAvailableColumns >= capacity.columns);
  const rowsOk =
    (candidate.minAvailableRows == null || candidate.minAvailableRows <= capacity.rows)
    && (candidate.maxAvailableRows == null || candidate.maxAvailableRows >= capacity.rows);
  return columnsOk && rowsOk;
}

function isContradictoryCandidate(candidate) {
  const columnsContradictory =
    candidate.minAvailableColumns != null && candidate.maxAvailableColumns != null
    && candidate.minAvailableColumns > candidate.maxAvailableColumns;
  const rowsContradictory =
    candidate.minAvailableRows != null && candidate.maxAvailableRows != null
    && candidate.minAvailableRows > candidate.maxAvailableRows;
  return columnsContradictory || rowsContradictory;
}

function candidateSpecificity(candidate) {
  const bounds = [
    candidate.minAvailableColumns,
    candidate.maxAvailableColumns,
    candidate.minAvailableRows,
    candidate.maxAvailableRows,
  ];
  const declared = bounds.filter((bound) => bound != null).length;
  let width = 0;
  if (candidate.minAvailableColumns != null && candidate.maxAvailableColumns != null) {
    width += candidate.maxAvailableColumns - candidate.minAvailableColumns;
  }
  if (candidate.minAvailableRows != null && candidate.maxAvailableRows != null) {
    width += candidate.maxAvailableRows - candidate.minAvailableRows;
  }
  return { declared, width };
}

function selectDefaultSurfaceLayout(capacity, candidates) {
  const matching = (candidates ?? []).filter((candidate) => candidateMatchesCapacity(candidate, capacity));
  if (!matching.length) return null;

  matching.sort((a, b) => {
    const priorityDiff = (b.layoutPriority ?? 0) - (a.layoutPriority ?? 0);
    if (priorityDiff !== 0) return priorityDiff;
    const specificityA = candidateSpecificity(a);
    const specificityB = candidateSpecificity(b);
    if (specificityA.declared !== specificityB.declared) return specificityB.declared - specificityA.declared;
    if (specificityA.width !== specificityB.width) return specificityA.width - specificityB.width;
    if (a.iri < b.iri) return -1;
    if (a.iri > b.iri) return 1;
    return 0;
  });
  return matching[0];
}

class OntoPresentationSurface extends HTMLElement {
  #root;
  #surfaceEl;
  #eventBarEl;
  #regions = []; // [{ id, role, element, slotEl, placementByTag }]
  #regionById = new Map();
  #definition = null; // explicit SurfaceDefinition JSON, or null
  #defaultLayouts = []; // DefaultSurfaceLayout candidate SurfaceDefinition JSON list
  #activeSurfaceIri = null; // identity of the topology currently materialized: null means legacy
  #resizeObserver;
  #slotTarget = 72;
  #gap = 12;
  #padding = 16;
  #tileMargin = 0;
  #columns = 1;
  #slotSize = 72;
  #eventBarTimer = null;
  // H5 (infobim-view-slow-crash): inverted cache + debounce to drop layout
  // complexity from O(N·slots_changes) ≈ O(N²) down to O(N) amortized.
  #regionElements = new Map(); // regionId → Set<Element>
  #regionOccupiedColumns = new Map(); // regionId → number (sum of allocated columns for placed items)
  #layoutRafId = null;
  #childListObserver = null;

  static get observedAttributes() {
    return ["slot-target", "gap", "padding", "tile-margin"];
  }

  constructor() {
    super();
    this.#root = this.attachShadow({ mode: "closed" });
    this.#root.innerHTML = `
      <style>
        :host {
          all: initial;
          display: block;
          box-sizing: border-box;
          inline-size: 100%;
          block-size: 100dvh;
          min-inline-size: 0;

        .surface:not([data-semantic="true"]) {

          right: var(--onto-surface-padding, 16px);
          bottom: calc(
            var(--onto-surface-padding, 16px) +

          z-index: 1;
          padding: 3px 10px;
          border-radius: 6px;
          font-size: 11px;
          line-height: 1.4;
          white-space: nowrap;
          overflow: hidden;

          pointer-events: none;
          background: color-mix(in srgb, var(--onto-theme-background, #ffffff) 88%, black 12%);
          color: color-mix(in srgb, var(--onto-theme-foreground, #0f172a) 75%, transparent);
          opacity: 0;
          transform: translateY(3px);
          transition: opacity .18s ease, transform .18s ease;
        }

        .event-bar[data-visible="true"] {

          transform: translateY(0);
        }

        .region {

          min-block-size: 0;
          gap: var(--onto-surface-gap, 12px);

           Tile column/row spans). */

          grid-template-columns: repeat(var(--onto-surface-columns, 1), minmax(0, 1fr));
          grid-auto-flow: row dense;
          grid-auto-rows: var(--onto-surface-slot-size, 72px);
          align-content: start;

        /* Bounded (Operation/Pinned/generic) regions: a single-row toolbar.
           Flexbox lets declared end-aligned placements actually sit at the
           far edge (an auto inline-start margin at each alignment-group
           boundary — see #layoutBoundedRegion) instead of only affecting
           relative order. */
        .region:not([data-region-role="ContentRegion"]) {

          flex-wrap: nowrap;

             size their own internal SVG/content relative to a stretched

          overflow-x: hidden;
          overscroll-behavior: contain;
        }

        .region[data-region-role="ContentRegion"] ::slotted(*) {
          grid-column: span var(--onto-surface-column-span, 1);

        .region:not([data-region-role="ContentRegion"]) ::slotted(*) {

            var(--onto-surface-column-span, 1) * var(--onto-surface-slot-size, 72px)
            + (var(--onto-surface-column-span, 1) - 1) * var(--onto-surface-gap, 12px)
          );
          margin-inline-start: var(--onto-surface-push-before, 0);
        }

        ::slotted(*) {
          min-inline-size: 0;
          min-block-size: 0;

    this.#surfaceEl = this.#root.querySelector(".surface");
    this.#eventBarEl = this.#root.querySelector(".event-bar");
    this.#buildLegacyRegions();
  }

  connectedCallback() {
    //#region debug-point (infobim-view-slow-crash): H5 connect instrumentation
    const _dbg_t0 = performance.now();
    DBG_SURFACE.connectedCount += 1;
    DBG_SURFACE.childrenCount = this.children.length;
    console.debug("[OntoBDC Surface][DBG] connectedCallback start — children=%d", DBG_SURFACE.childrenCount);
    if (window.__ONTOBDC_SURFACE_DBG__ == null) window.__ONTOBDC_SURFACE_DBG__ = DBG_SURFACE;
    //#endregion
    this.#syncConfig();
    //#region debug-point (infobim-view-slow-crash): H5 reconcile timer
    const _dbg_trec0 = performance.now();
    DBG_SURFACE.reconciledCount = this.children.length;
    //#endregion
    this.#reconcileChildRegions();
    //#region debug-point (infobim-view-slow-crash): H5 reconcile timer stop
    DBG_SURFACE.reconcileWallMs += performance.now() - _dbg_trec0;
    console.debug("[OntoBDC Surface][DBG] reconcileChildRegions took %.2f ms for %d children",
      performance.now() - _dbg_trec0, DBG_SURFACE.reconciledCount);
    //#endregion
    // H5: ResizeObserver fires on every pixel nudge during window drag — coalesce via rAF.
    this.#resizeObserver = new ResizeObserver(() => this.#scheduleLayout());
    this.#resizeObserver.observe(this);
    // H5: ChildListObserver catches appendChild/remove/setRegion on light-DOM tiles so
    // the inverted cache stays correct without relying on per-tile slotchange spam.
    // attributeFilter: surface-region is the only attribute that changes a tile's bucket.
    this.#childListObserver = new MutationObserver((mutations) => {
      let needsRebuild = false;
      for (const mut of mutations) {
        if (mut.type === "childList" && (mut.addedNodes.length || mut.removedNodes.length)) {
          needsRebuild = true;
          break;
        }
        if (mut.type === "attributes" && mut.attributeName === "surface-region") {
          needsRebuild = true;
          break;
        }
      }
      if (needsRebuild) {
        this.#invalidateRegionCache();
        this.#scheduleLayout();
      }
    });
    this.#childListObserver.observe(this, {
      childList: true,
      subtree: false,
      attributes: true,
      attributeFilter: ["surface-region", "slot"],
    });
    //#region debug-point (infobim-view-slow-crash): H5 first layout timer
    const _dbg_t_layout_0 = performance.now();
    //#endregion
    // First layout runs synchronously so callers reading `columns`/`slotSize` get real values
    // immediately after mount. Subsequent mutations all go through #scheduleLayout debounce.
    this.#layoutSynchronous(true);
    //#region debug-point (infobim-view-slow-crash): H5 first layout timer stop
    DBG_SURFACE.layoutFirstMs = performance.now() - _dbg_t_layout_0;
    console.debug("[OntoBDC Surface][DBG] FIRST #layoutSync took %.2f ms — layoutCallCount=%d itemsInCall=%d itemsInRoleCall=%d fitsRegionCall=%d",
      DBG_SURFACE.layoutFirstMs,
      DBG_SURFACE.layoutCallCount,
      DBG_SURFACE.itemsInCallCount,
      DBG_SURFACE.itemsInRoleCallCount,
      DBG_SURFACE.fitsRegionCallCount);

    // `SurfaceLoaded` — the Surface finished materializing its topology and
    // laid out its Tiles for the first time. Whether that means anything to
