<title>ifc work schedule</title>


<script>
  (() => {
    const themes = [{"name": "light", "label": "Light", "tokens": {"background": "#ffffff", "foreground": "#0f172a", "accent": "#0284c7", "borderColor": "rgba(2,132,199,.35)"}, "options": {"transparentBackground": false}}, {"name": "dark", "label": "Dark", "tokens": {"background": "#000000", "foreground": "#f8fafc", "accent": "#38bdf8", "borderColor": "rgba(56,189,248,.55)"}, "options": {"transparentBackground": false}}];
    const params = new URLSearchParams(location.search);
    const language = window.ontobdcUrlState?.value("lang") ?? params.get("lang");
    if (language) {
      document.documentElement.lang = language;
      document.documentElement.dataset.language = language;
    }
    const requested = window.ontobdcUrlState?.value("theme") ?? params.get("theme");
    const theme = themes.find((candidate) => candidate.name === requested) ?? themes[0];
    if (!theme) return;
    document.documentElement.dataset.theme = theme.name;
    document.documentElement.style.colorScheme = theme.name === "dark" ? "dark" : "light";
    for (const [key, value] of Object.entries(theme.tokens ?? {})) {
      document.documentElement.style.setProperty(`--onto-theme-${key}`, value);
    }
    document.addEventListener("DOMContentLoaded", () => {
      const backLink = document.querySelector(".back-link");
      if (!backLink) return;
      backLink.href = decorateInternalUrl(backLink.getAttribute("href"));
    });

    function decorateInternalUrl(href) {
      const state = window.ontobdcUrlState;
      if (state && typeof state.decorate === "function") return state.decorate(href);
      const applied = {
        lang: () => document.documentElement.lang || document.documentElement.dataset.language || "",
        theme: () => document.documentElement.dataset.theme || "",
      };
      try {
        const target = new URL(href, location.href);
        const current = new URLSearchParams(location.search);
        for (const name of ["lang", "theme"]) {
          if (target.searchParams.has(name)) continue;
          const carried = current.get(name) || applied[name]();
          if (carried) target.searchParams.set(name, carried);
        }
        return target.href;
      } catch {
        return href;
      }
    }
  })();
</script>

  background: var(--onto-theme-primary-container, color-mix(in srgb, var(--onto-theme-accent, #0ea5e9) 22%, var(--onto-theme-background, #ffffff)));
  color: var(--onto-theme-on-primary-container, var(--onto-theme-foreground, #0f172a));
  border-color: var(--onto-theme-accent, #0ea5e9);
}

.onto-gantt-edit-btn-primary:disabled {
  opacity: .6;
  cursor: default;
}

/* The printer action uses the browser's native print/PDF pipeline. Keep the
 * semantic title and the complete 4D table/chart, but remove interactive
 * chrome and any viewport clipping from the printed document. */
@page {
  size: A4 landscape;
  margin: 10mm;
}

@media print {
  :root {
    color-scheme: light;
    --gantt-paper: #ffffff;
    --gantt-ink: #0f172a;
    --gantt-paper-muted: #f1f5f9;
    --gantt-paper-line: #cbd5e1;
  }

  html,
  body {
    width: auto !important;
    height: auto !important;
    overflow: visible !important;
    background: var(--gantt-paper) !important;
    color: var(--gantt-ink) !important;
  }

  .header-actions,
  .back-link,
  .dimension-cards,
  dialog,
  .onto-inline-edit-actions,
  .onto-inline-edit-error {
    display: none !important;
  }

  .onto-page,
  .onto-page-body.tile {
    width: 100% !important;
    max-width: none !important;
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  .onto-page-header {
    min-height: 0 !important;
    margin: 0 0 6mm !important;
    padding: 0 0 3mm !important;
    border-bottom: 1px solid var(--gantt-paper-line) !important;
  }

  .gantt-container {
    width: 100% !important;
    max-height: none !important;
    grid-template-columns: 38% 62% !important;
    overflow: visible !important;
    break-inside: avoid-page;
    background: var(--gantt-paper) !important;
    color: var(--gantt-ink) !important;
  }

  .gantt-left,
  .gantt-right {
    overflow: visible !important;
  }

  .gantt-table th,
  .gantt-timeline-header {
    position: static !important;
    background: var(--gantt-paper-muted) !important;
    color: var(--gantt-ink) !important;
  }

  .gantt-bar-text {
    fill: var(--gantt-ink) !important;
  }
}


.gantt-filter-dialog {
  border: 1px solid color-mix(in srgb, var(--onto-theme-foreground, #111827) 18%, transparent);
  border-radius: 14px;
  padding: 0;
  min-width: min(420px, calc(100vw - 32px));
  background: var(--onto-theme-background, #fff);
  color: var(--onto-theme-foreground, #111827);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
  color-scheme: inherit;
}
.gantt-filter-dialog::backdrop { background: rgba(0,0,0,.38); }
.gantt-filter-form { display: grid; gap: 18px; padding: 20px; }
.gantt-filter-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.gantt-filter-heading h2 { margin:0; font-size:18px; }
.gantt-filter-close { font-size:22px; line-height:1; }
.gantt-filter-field { display:grid; gap:7px; font-size:13px; font-weight:600; }
.gantt-filter-field input[type="date"] {
  width:100%; box-sizing:border-box; padding:9px 10px; border-radius:8px;
  border:1px solid color-mix(in srgb, var(--onto-theme-foreground, #111827) 22%, transparent);
  background:var(--onto-theme-background, #fff); color:var(--onto-theme-foreground, #111827);
  color-scheme: inherit;
}
.gantt-filter-toggle-row { display:flex; align-items:center; justify-content:space-between; gap:16px; font-size:13px; font-weight:600; cursor:pointer; }
.gantt-filter-toggle { position:relative; display:inline-flex; }
.gantt-filter-toggle input { position:absolute; opacity:0; pointer-events:none; }
.gantt-filter-toggle-track { width:42px; height:24px; border-radius:999px; background:color-mix(in srgb, var(--onto-theme-foreground, #111827) 24%, transparent); padding:2px; box-sizing:border-box; transition:.18s ease; }
.gantt-filter-toggle-thumb { display:block; width:20px; height:20px; border-radius:50%; background:var(--onto-theme-background, #fff); box-shadow:0 1px 4px rgba(0,0,0,.28); transition:.18s ease; }
.gantt-filter-toggle input:checked + .gantt-filter-toggle-track { background:var(--onto-theme-accent, #2563eb); }
.gantt-filter-toggle input:checked + .gantt-filter-toggle-track .gantt-filter-toggle-thumb { transform:translateX(18px); }
.gantt-filter-toggle-row.is-disabled { cursor:not-allowed; opacity:.5; }
.gantt-filter-toggle input:disabled + .gantt-filter-toggle-track { cursor:not-allowed; }
.gantt-filter-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:2px; }
.gantt-filter-actions button { padding:8px 14px; border-radius:8px; cursor:pointer; }
.gantt-filter-reset { background:transparent; color:inherit; border:1px solid color-mix(in srgb, var(--onto-theme-foreground, #111827) 22%, transparent); }
.gantt-filter-apply { border:0; background:var(--onto-theme-accent, #2563eb); color:#fff; }
.gantt-filter-btn[data-filter-active="true"] { outline:2px solid var(--onto-theme-accent, #2563eb); outline-offset:2px; }
</style>

<script>
(function () {
  const INSTALL_KEY = Symbol.for("ontobdc.gantt.auto-refresh-installed");

  function installAutoRefresh() {
    const rt = window.OntoBDCGanttViewRuntime;
    if (!rt || rt[INSTALL_KEY]) return false;
    if (
      typeof rt.refreshFromWorkbook !== "function" ||
      typeof rt.saveScheduleField !== "function" ||
      typeof rt.saveTaskName !== "function" ||
      typeof rt.saveTaskDates !== "function"
    ) {
      return false;
    }

    rt[INSTALL_KEY] = true;
    let timer = null;
    let refreshing = false;
    let queued = false;

    rt.scheduleRefresh = function scheduleRefresh() {
      queued = true;
      if (timer !== null || refreshing) return;
      timer = window.setTimeout(async function () {
        timer = null;
        if (!queued || refreshing) return;
        queued = false;
        refreshing = true;
        try {
          await rt.refreshFromWorkbook();
        } catch (error) {
          console.error("[ifc-work-schedule-view] automatic refresh failed", error);
        } finally {
          refreshing = false;
          if (queued) rt.scheduleRefresh();
        }
      }, 50);
    };

    function wrapMutation(name) {
      const original = rt[name];
      if (typeof original !== "function" || original.__ontobdcAutoRefreshWrapped) return;
      const wrapped = async function (...args) {
        const result = await original.apply(this, args);
        rt.scheduleRefresh();
        return result;
      };
      Object.defineProperty(wrapped, "__ontobdcAutoRefreshWrapped", { value: true });
      rt[name] = wrapped;
    }

    // These are the logical edit boundaries. WBS + dates are intentionally
    // refreshed only after saveTaskDates finishes, because the edit dialog can
    // persist Identification first and TaskTime second in one Save action.
    wrapMutation("saveScheduleField");
    wrapMutation("saveTaskName");
    wrapMutation("saveTaskDates");
    return true;
  }

  window.addEventListener("ontobdc:gantt-scripts-ready", installAutoRefresh);
  installAutoRefresh();
})();
</script>
<script>
window.addEventListener("load", function () {
  const rt = window.OntoBDCGanttViewRuntime;
  const dialog = document.getElementById("gantt-filter-dialog");
  const form = document.getElementById("gantt-filter-form");
  const startInput = document.getElementById("gantt-filter-start");
  const endInput = document.getElementById("gantt-filter-end");
  const criticalInput = document.getElementById("gantt-filter-critical");
  const openBtn = document.querySelector(".gantt-filter-btn");
  const closeBtn = document.querySelector(".gantt-filter-close");
  const resetBtn = document.querySelector(".gantt-filter-reset");
  const fsBtn = document.querySelector(".gantt-fullscreen-btn");

  // ── Fullscreen toggle ──────────────────────────────────────────────────
  if (fsBtn) {
    const ENTER_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
    const EXIT_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
    function t(key, fallback) {
      try {
        const rt_ = window.OntoBDCGanttViewRuntime;
        if (rt_ && typeof rt_.t === "function") {
          const value = rt_.t(key);
          if (value && value !== key) return value;
        }
      } catch (e) {}
      return fallback;
    }
    function setFsIcon(active) {
      const label = active ? t("exitFullscreen", "Exit fullscreen") : t("enterFullscreen", "Open fullscreen");
      fsBtn.innerHTML = active ? EXIT_SVG : ENTER_SVG;
      fsBtn.setAttribute("title", label);
      fsBtn.setAttribute("aria-label", label);
      if (active) {
        document.documentElement.classList.add("is-fullscreen-presenting");
        document.documentElement.dataset.fullscreenPresenting = "true";
      } else {
        document.documentElement.classList.remove("is-fullscreen-presenting");
        delete document.documentElement.dataset.fullscreenPresenting;
      }
    }
    function isFsActive() {
      try {
        return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      } catch (e) { return false; }
    }
    function refreshFsState() {
      setFsIcon(isFsActive());
      try { window.dispatchEvent(new Event("resize")); } catch (e) {}
    }
    fsBtn.addEventListener("click", function () {
      try {
        if (isFsActive()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        } else {
          const root = document.documentElement;
          const req = root.requestFullscreen || root.webkitRequestFullscreen;
          if (req) req.call(root);
        }
      } catch (e) {}
      setTimeout(refreshFsState, 0);
    });
    if ("onfullscreenchange" in document) {
      document.addEventListener("fullscreenchange", refreshFsState);
    } else if ("onwebkitfullscreenchange" in document) {
      document.addEventListener("webkitfullscreenchange", refreshFsState);
    }
    refreshFsState();
  }

  if (!rt || !dialog || !form || !openBtn || typeof rt.runRender !== "function") return;

  const originalRunRender = rt.runRender.bind(rt);
  const originalRunParse = typeof rt.runParse === "function" ? rt.runParse.bind(rt) : null;
  const filter = rt.state.ganttFilter = {
    start: null,
    end: null,
    showCritical: false,
    sourceTasks: Array.isArray(rt.state.enrichedTasks) ? rt.state.enrichedTasks : [],
    renderedTasks: null
  };

  function dayStart(value) {
    if (!value) return null;
    const parts = String(value).split("-").map(Number);
    if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function dayEnd(value) {
    const d = dayStart(value);
    if (!d) return null;
    d.setHours(23, 59, 59, 999);
    return d;
  }
  function clippedTask(task) {
    const sourceStart = task.scheduleStart;
    const sourceFinish = task.scheduleFinish || task.scheduleStart;
    if (!sourceStart && !sourceFinish) return task;
    if (filter.start && sourceFinish && sourceFinish < filter.start) return null;
    if (filter.end && sourceStart && sourceStart > filter.end) return null;
    const start = filter.start && sourceStart && sourceStart < filter.start ? new Date(filter.start) : sourceStart;
    const finish = filter.end && sourceFinish && sourceFinish > filter.end ? new Date(filter.end) : sourceFinish;
    const clone = Object.assign({}, task, {
      scheduleStart: start,
      scheduleFinish: finish,
      isCritical: filter.showCritical ? task.isCritical : false
    });
    if (start && finish) clone.duration_days = Math.max(0.25, (finish.getTime() - start.getTime()) / rt.MILLIS_PER_DAY + 1);
    return clone;
  }
  function renderFiltered() {
    const current = Array.isArray(rt.state.enrichedTasks) ? rt.state.enrichedTasks : [];
    if (current !== filter.renderedTasks) filter.sourceTasks = current;
    const visible = filter.sourceTasks.map(clippedTask).filter(Boolean);
    filter.renderedTasks = visible;
    rt.state.enrichedTasks = visible;
    const schedule = rt.state.schedule;
    rt.state.schedule = null;
    originalRunRender();
    rt.state.schedule = schedule;
    if (typeof rt.runArrows === "function") rt.runArrows();
    // The critical-path toggle is disabled for now, so only the date range
    // marks the filter as active.
    openBtn.dataset.filterActive = String(Boolean(filter.start || filter.end));
  }
  if (originalRunParse) {
    rt.runParse = function () {
      originalRunParse();
      filter.sourceTasks = Array.isArray(rt.state.enrichedTasks) ? rt.state.enrichedTasks : [];
      filter.renderedTasks = null;
    };
  }
  rt.runRender = renderFiltered;

  openBtn.addEventListener("click", function () {
    startInput.value = filter.start ? rt.formatDate(filter.start) : "";
    endInput.value = filter.end ? rt.formatDate(filter.end) : "";
    criticalInput.checked = filter.showCritical;
    dialog.showModal();
  });
  closeBtn.addEventListener("click", function () { dialog.close(); });
  dialog.addEventListener("click", function (event) { if (event.target === dialog) dialog.close(); });
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    const start = dayStart(startInput.value);
    const end = dayEnd(endInput.value);
    if (start && end && start > end) {
      startInput.setCustomValidity(rt.t("ganttFilterInvalidRange"));
      startInput.reportValidity();
      return;
    }
    startInput.setCustomValidity("");
    filter.start = start;
    filter.end = end;
    filter.showCritical = criticalInput.checked;
    dialog.close();
    renderFiltered();
  });
  resetBtn.addEventListener("click", function () {
    startInput.value = "";
    endInput.value = "";
    criticalInput.checked = false;
    filter.start = null;
    filter.end = null;
    filter.showCritical = false;
    dialog.close();
    renderFiltered();
  });

  renderFiltered();
});
</script>
